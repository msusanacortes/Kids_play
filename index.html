<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Video App</title>
    
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Estilos base para ocultar la barra de desplazamiento */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTES DE ÍCONOS (Reemplazando lucide-react para uso sin bundler) ---
        const Icon = ({ children, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Play = (props) => <Icon {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></Icon>;
        const Heart = (props) => <Icon {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></Icon>;
        const Clock = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></Icon>;
        const Home = (props) => <Icon {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></Icon>;
        const Lock = (props) => <Icon {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></Icon>;
        const Plus = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Star = (props) => <Icon {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></Icon>;
        const Sparkles = (props) => <Icon {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></Icon>;
        const X = (props) => <Icon {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></Icon>;
        const Music = (props) => <Icon {...props}><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></Icon>;
        const BookOpen = (props) => <Icon {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></Icon>;
        const Smile = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></Icon>;

        // --- DATOS SIMULADOS INICIALES ---
        const INITIAL_PROFILES = [
            { id: '1', name: 'Leo', avatar: '👦', color: 'bg-blue-400', favorites: [1, 3], history: [2, 1] },
            { id: '2', name: 'Mía', avatar: '👧', color: 'bg-pink-400', favorites: [2], history: [] },
            { id: '3', name: 'Hugo', avatar: '👶', color: 'bg-green-400', favorites: [], history: [] },
            { id: '4', name: 'Ana', avatar: '👧🏽', color: 'bg-purple-400', favorites: [4, 5], history: [4] }
        ];

        const INITIAL_VIDEOS = [
            { id: 1, title: 'La Vaca Lola', category: 'Música', isNew: true, thumbnail: 'https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=400&q=80' },
            { id: 2, title: 'Aprende los Colores', category: 'Educativo', isNew: true, thumbnail: 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=400&q=80' },
            { id: 3, title: 'Aventuras Espaciales', category: 'Animación', isNew: false, thumbnail: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=400&q=80' },
            { id: 4, title: 'El Abecedario', category: 'Educativo', isNew: false, thumbnail: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=400&q=80' },
            { id: 5, title: 'El Baile del Sapito', category: 'Música', isNew: false, thumbnail: 'https://images.unsplash.com/photo-1516253593875-bd7ba052fbc5?auto=format&fit=crop&w=400&q=80' },
        ];

        const CATEGORIES = [
            { name: 'Todos', icon: Star },
            { name: 'Música', icon: Music },
            { name: 'Animación', icon: Smile },
            { name: 'Educativo', icon: BookOpen }
        ];

        function App() {
            const [profiles, setProfiles] = useState(INITIAL_PROFILES);
            const [videos, setVideos] = useState(INITIAL_VIDEOS);
            const [activeProfileId, setActiveProfileId] = useState(null);
            
            // Vistas: 'selector', 'kids_home', 'kids_history', 'kids_favorites', 'parent_gate', 'parent_dashboard'
            const [currentView, setCurrentView] = useState('selector');
            const [activeCategory, setActiveCategory] = useState('Todos');
            const [playingVideo, setPlayingVideo] = useState(null);

            const activeProfile = profiles.find(p => p.id === activeProfileId);

            // Lógica
            const handleLogin = (id) => {
                setActiveProfileId(id);
                setCurrentView('kids_home');
            };

            const handleLogout = () => {
                setActiveProfileId(null);
                setCurrentView('selector');
            };

            const toggleFavorite = (videoId) => {
                setProfiles(profiles.map(profile => {
                    if (profile.id === activeProfileId) {
                        const isFav = profile.favorites.includes(videoId);
                        return {
                            ...profile,
                            favorites: isFav ? profile.favorites.filter(id => id !== videoId) : [...profile.favorites, videoId]
                        };
                    }
                    return profile;
                }));
            };

            const playVideo = (video) => {
                setProfiles(profiles.map(profile => {
                    if (profile.id === activeProfileId) {
                        const newHistory = [video.id, ...profile.history.filter(id => id !== video.id)].slice(0, 20);
                        return { ...profile, history: newHistory };
                    }
                    return profile;
                }));
                setPlayingVideo(video);
            };

            const addNewVideo = (newVideoData) => {
                const newVideo = { ...newVideoData, id: Date.now(), isNew: true };
                setVideos([newVideo, ...videos]);
                setCurrentView('kids_home');
            };

            // 1. Selector de Perfiles
            if (currentView === 'selector') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-blue-50 p-6 font-sans">
                        <h1 className="text-4xl font-extrabold text-blue-600 mb-8 text-center drop-shadow-sm">¿Quién está viendo hoy?</h1>
                        <div className="grid grid-cols-2 gap-6 w-full max-w-sm">
                            {profiles.map(profile => (
                                <button key={profile.id} onClick={() => handleLogin(profile.id)} className={`${profile.color} rounded-3xl p-6 flex flex-col items-center justify-center shadow-lg transform transition active:scale-95`}>
                                    <span className="text-6xl mb-4">{profile.avatar}</span>
                                    <span className="text-xl font-bold text-white">{profile.name}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            // 2. Puerta Parental
            if (currentView === 'parent_gate') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-gray-800 p-6 text-white font-sans">
                        <Lock className="w-16 h-16 mb-6 text-yellow-400" />
                        <h2 className="text-2xl font-bold mb-4 text-center">Zona para Papás</h2>
                        <p className="mb-8 text-center text-gray-300">Para entrar, resuelve la siguiente operación:</p>
                        <div className="text-4xl font-bold mb-8">7 x 3 = ?</div>
                        <div className="grid grid-cols-3 gap-4 w-full max-w-xs">
                            {[14, 21, 28].map(ans => (
                                <button key={ans} onClick={() => ans === 21 ? setCurrentView('parent_dashboard') : setCurrentView('kids_home')} className="bg-gray-700 p-4 rounded-xl text-xl font-bold active:bg-gray-600">
                                    {ans}
                                </button>
                            ))}
                        </div>
                        <button onClick={() => setCurrentView('kids_home')} className="mt-12 text-gray-400 underline">Volver</button>
                    </div>
                );
            }

            // 3. Dashboard Parental
            if (currentView === 'parent_dashboard') {
                const ParentDashboard = () => {
                    const [title, setTitle] = useState('');
                    const [category, setCategory] = useState('Música');
                    const [thumbnail, setThumbnail] = useState('https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=400&q=80');

                    const handleSubmit = (e) => {
                        e.preventDefault();
                        if (title) addNewVideo({ title, category, thumbnail });
                    };

                    return (
                        <div className="min-h-screen bg-gray-100 p-4 sm:p-6 font-sans">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold text-gray-800">Panel de Control</h2>
                                <button onClick={() => setCurrentView('kids_home')} className="text-blue-600 font-bold">Cerrar</button>
                            </div>
                            
                            <div className="bg-white p-6 rounded-2xl shadow-sm mb-6">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <Plus className="text-green-500 w-5 h-5" /> Añadir Nuevo Video
                                </h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Título del Video</label>
                                        <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ej: Canción del Abecedario" className="w-full p-3 border rounded-xl" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                                        <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full p-3 border rounded-xl">
                                            <option>Música</option>
                                            <option>Animación</option>
                                            <option>Educativo</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">URL de Portada</label>
                                        <input type="text" value={thumbnail} onChange={(e) => setThumbnail(e.target.value)} className="w-full p-3 border rounded-xl bg-gray-50 text-gray-500" readOnly />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition">
                                        Guardar y Publicar
                                    </button>
                                </form>
                            </div>
                        </div>
                    );
                };
                return <ParentDashboard />;
            }

            // Modal de Reproductor
            const VideoPlayerModal = () => {
                if (!playingVideo) return null;
                return (
                    <div className="fixed inset-0 bg-black z-50 flex flex-col">
                        <div className="flex justify-between items-center p-4 bg-gray-900 text-white">
                            <h3 className="font-bold truncate">{playingVideo.title}</h3>
                            <button onClick={() => setPlayingVideo(null)} className="p-2 bg-gray-800 rounded-full">
                                <X className="w-6 h-6" />
                            </button>
                        </div>
                        <div className="flex-1 flex items-center justify-center bg-black relative">
                            <img src={playingVideo.thumbnail} alt={playingVideo.title} className="w-full h-full object-cover opacity-50 blur-sm absolute" />
                            <div className="relative z-10 flex flex-col items-center">
                                <Play className="w-24 h-24 text-white opacity-80 mb-4 animate-pulse" fill="currentColor" />
                                <p className="text-white text-xl font-bold">Simulando Video...</p>
                            </div>
                        </div>
                    </div>
                );
            };

            // Vistas principales (Niños)
            let displayVideos = [];
            if (currentView === 'kids_history') displayVideos = activeProfile.history.map(id => videos.find(v => v.id === id)).filter(Boolean);
            else if (currentView === 'kids_favorites') displayVideos = activeProfile.favorites.map(id => videos.find(v => v.id === id)).filter(Boolean);
            else displayVideos = activeCategory === 'Todos' ? videos : videos.filter(v => v.category === activeCategory);

            const newReleases = videos.filter(v => v.isNew);

            return (
                <div className="min-h-screen bg-gray-50 font-sans pb-24 max-w-md mx-auto relative shadow-2xl overflow-hidden">
                    {/* Encabezado */}
                    <div className="bg-white px-4 pt-6 pb-4 rounded-b-3xl shadow-sm flex justify-between items-center sticky top-0 z-20">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={handleLogout}>
                            <div className={`${activeProfile.color} w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-inner border-2 border-white`}>
                                {activeProfile.avatar}
                            </div>
                            <div>
                                <p className="text-xs text-gray-500 font-bold uppercase tracking-wider">¡Hola!</p>
                                <h1 className="text-xl font-extrabold text-gray-800">{activeProfile.name}</h1>
                            </div>
                        </div>
                        <button onClick={() => setCurrentView('parent_gate')} className="p-3 bg-gray-100 rounded-full text-gray-500 active:bg-gray-200">
                            <Lock className="w-5 h-5" />
                        </button>
                    </div>

                    <div className="p-4 space-y-6">
                        {/* Videos Nuevos */}
                        {currentView === 'kids_home' && newReleases.length > 0 && (
                            <section>
                                <h2 className="text-xl font-extrabold text-gray-800 mb-3 flex items-center gap-2">
                                    <Sparkles className="text-yellow-500 w-5 h-5" /> ¡Videos Nuevos!
                                </h2>
                                <div className="flex overflow-x-auto gap-4 pb-4 snap-x hide-scrollbar">
                                    {newReleases.map(video => (
                                        <div key={video.id} onClick={() => playVideo(video)} className="snap-center shrink-0 w-64 relative rounded-3xl overflow-hidden shadow-lg cursor-pointer">
                                            <div className="absolute top-2 left-2 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full z-10 animate-bounce">¡NUEVO!</div>
                                            <img src={video.thumbnail} alt={video.title} className="w-full h-40 object-cover" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <div className="bg-white/30 p-3 rounded-full backdrop-blur-sm"><Play className="w-8 h-8 text-white" fill="currentColor" /></div>
                                            </div>
                                            <div className="absolute bottom-0 left-0 right-0 p-4">
                                                <h3 className="text-white font-bold text-lg leading-tight truncate">{video.title}</h3>
                                                <p className="text-gray-300 text-xs">{video.category}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {/* Categorías */}
                        {currentView === 'kids_home' && (
                            <div className="flex overflow-x-auto gap-2 pb-2 hide-scrollbar">
                                {CATEGORIES.map(cat => {
                                    const IconComponent = cat.icon;
                                    const isActive = activeCategory === cat.name;
                                    return (
                                        <button key={cat.name} onClick={() => setActiveCategory(cat.name)} className={`flex items-center gap-2 px-5 py-3 rounded-full font-bold whitespace-nowrap transition-colors ${isActive ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-gray-600 border border-gray-200'}`}>
                                            <IconComponent className={`w-5 h-5 ${isActive ? 'text-white' : 'text-blue-500'}`} /> {cat.name}
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        {/* Lista de Videos */}
                        <section>
                            <h2 className="text-xl font-extrabold text-gray-800 mb-4">
                                {currentView === 'kids_history' ? 'Lo que has visto' : currentView === 'kids_favorites' ? 'Tus Favoritos' : activeCategory === 'Todos' ? 'Para ti' : activeCategory}
                            </h2>
                            {displayVideos.length === 0 ? (
                                <div className="text-center py-10 bg-white rounded-3xl border-2 border-dashed border-gray-200">
                                    <p className="text-gray-500 font-bold text-lg">¡Aún no hay videos aquí!</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 gap-4">
                                    {displayVideos.map(video => {
                                        const isFavorite = activeProfile.favorites.includes(video.id);
                                        return (
                                            <div key={video.id} className="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col relative">
                                                <button onClick={(e) => { e.stopPropagation(); toggleFavorite(video.id); }} className="absolute top-2 right-2 p-2 bg-white/80 backdrop-blur-sm rounded-full z-10 shadow-sm active:scale-90 transition">
                                                    <Heart className={`w-5 h-5 ${isFavorite ? 'text-red-500' : 'text-gray-400'}`} fill={isFavorite ? "currentColor" : "none"} />
                                                </button>
                                                <div onClick={() => playVideo(video)} className="relative cursor-pointer group">
                                                    <img src={video.thumbnail} alt={video.title} className="w-full h-32 object-cover" />
                                                    <div className="absolute inset-0 bg-black/20 group-active:bg-black/40 transition flex items-center justify-center">
                                                        <Play className="w-10 h-10 text-white opacity-80 drop-shadow-md" fill="currentColor" />
                                                    </div>
                                                </div>
                                                <div className="p-3">
                                                    <h3 className="font-bold text-gray-800 text-sm leading-tight line-clamp-2">{video.title}</h3>
                                                    <p className="text-xs text-gray-500 mt-1">{video.category}</p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </section>
                    </div>

                    {/* Navegación Inferior */}
                    <div className="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20">
                        <NavButton icon={Home} label="Inicio" isActive={currentView === 'kids_home'} onClick={() => setCurrentView('kids_home')} />
                        <NavButton icon={Clock} label="Historial" isActive={currentView === 'kids_history'} onClick={() => setCurrentView('kids_history')} />
                        <NavButton icon={Heart} label="Favoritos" isActive={currentView === 'kids_favorites'} onClick={() => setCurrentView('kids_favorites')} />
                    </div>

                    <VideoPlayerModal />
                </div>
            );
        }

        // Componente Navegación
        function NavButton({ icon: IconComponent, label, isActive, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-16 transition-transform ${isActive ? 'scale-110' : 'opacity-70 hover:opacity-100'}`}>
                    <div className={`p-2 rounded-2xl mb-1 ${isActive ? 'bg-blue-100 text-blue-600' : 'text-gray-500'}`}>
                        <IconComponent className="w-7 h-7" fill={isActive ? "currentColor" : "none"} />
                    </div>
                    <span className={`text-[10px] font-extrabold ${isActive ? 'text-blue-600' : 'text-gray-500'}`}>{label}</span>
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
