<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KidsPlay</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// Iconos de Lucide envueltos como componentes de React
function makeIcon(name) {
  return function Icon({ className = '', fill }) {
    const attrs = { class: className };
    if (fill) attrs.fill = fill;
    const svgStr = lucide.icons[name].toSvg(attrs);
    return <span style={{ display: 'contents' }} dangerouslySetInnerHTML={{ __html: svgStr }} />;
  };
}

const Play = makeIcon('play');
const Heart = makeIcon('heart');
const Clock = makeIcon('clock');
const Home = makeIcon('home');
const Lock = makeIcon('lock');
const Plus = makeIcon('plus');
const Star = makeIcon('star');
const Sparkles = makeIcon('sparkles');
const X = makeIcon('x');
const Check = makeIcon('check');
const Video = makeIcon('video');
const Music = makeIcon('music');
const BookOpen = makeIcon('book-open');
const Smile = makeIcon('smile');
const LogOut = makeIcon('log-out');
const AlertCircle = makeIcon('alert-circle');
const PlayCircle = makeIcon('play-circle');

// Heurística #2: Relación del sistema con el mundo real (Avatares expresivos de animalitos que los niños identifican)
const INITIAL_PROFILES = [
  { id: '1', name: 'Leo', avatar: 'https://cdn-icons-png.flaticon.com/512/3069/3069172.png', color: 'bg-blue-400', favorites: [6, 1], history: [2, 6] }, // Perrito feliz
  { id: '2', name: 'Mía', avatar: 'https://cdn-icons-png.flaticon.com/512/3069/3069166.png', color: 'bg-pink-400', favorites: [2], history: [] },    // Gatito tierno
  { id: '3', name: 'Hugo', avatar: 'https://cdn-icons-png.flaticon.com/512/3069/3069170.png', color: 'bg-green-400', favorites: [], history: [] },   // Osito sonriente
  { id: '4', name: 'Ana', avatar: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <circle cx="50" cy="55" r="38" fill="#FFFFFF"/>
      <circle cx="22" cy="22" r="14" fill="#2D2D2D"/>
      <circle cx="78" cy="22" r="14" fill="#2D2D2D"/>
      <circle cx="22" cy="22" r="7" fill="#5A5A5A"/>
      <circle cx="78" cy="22" r="7" fill="#5A5A5A"/>
      <ellipse cx="32" cy="52" rx="14" ry="17" fill="#2D2D2D"/>
      <ellipse cx="68" cy="52" rx="14" ry="17" fill="#2D2D2D"/>
      <circle cx="32" cy="53" r="5.5" fill="#FFFFFF"/>
      <circle cx="68" cy="53" r="5.5" fill="#FFFFFF"/>
      <circle cx="33" cy="54" r="2.6" fill="#1A1A1A"/>
      <circle cx="69" cy="54" r="2.6" fill="#1A1A1A"/>
      <ellipse cx="50" cy="68" rx="9" ry="7" fill="#2D2D2D"/>
      <path d="M50 74 Q50 80 42 80" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M50 74 Q50 80 58 80" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
  `), color: 'bg-purple-400', favorites: [4, 5], history: [4] } // Pandita alegre
];

const INITIAL_VIDEOS = [
  { id: 6, title: 'Cuatro en la Cama (Bluey)', category: 'Animación', isNew: true, thumbnail: 'https://img.youtube.com/vi/b9lcRCpiezY/maxresdefault.jpg', url: 'https://www.youtube.com/embed/b9lcRCpiezY?autoplay=1' },
  { id: 1, title: 'La Vaca Lola', category: 'Música', isNew: true, thumbnail: 'https://img.youtube.com/vi/vDxaqNYv4bY/maxresdefault.jpg', url: 'https://www.youtube.com/embed/vDxaqNYv4bY?autoplay=1' },
  { id: 2, title: 'El Monstruo de la Laguna', category: 'Música', isNew: true, thumbnail: 'https://img.youtube.com/vi/Wkp-8rPRlYY/maxresdefault.jpg', url: 'https://www.youtube.com/embed/Wkp-8rPRlYY?autoplay=1' },
  { id: 3, title: 'A Mi Burro Le Duele La Cabeza', category: 'Animación', isNew: false, thumbnail: 'https://img.youtube.com/vi/b5NmFJVffSw/maxresdefault.jpg', url: 'https://www.youtube.com/embed/b5NmFJVffSw?autoplay=1' },
  { id: 4, title: 'El Abecedario', category: 'Educativo', isNew: false, thumbnail: 'https://img.youtube.com/vi/CqTXa-O9wEQ/maxresdefault.jpg', url: 'https://www.youtube.com/embed/CqTXa-O9wEQ?autoplay=1' },
  { id: 5, title: 'El Baile del Sapito', category: 'Música', isNew: false, thumbnail: 'https://img.youtube.com/vi/mrxUPxG9YXY/maxresdefault.jpg', url: 'https://www.youtube.com/embed/mrxUPxG9YXY?autoplay=1' },
];

const CATEGORIES = [
  { name: 'Todos', icon: Star },
  { name: 'Música', icon: Music },
  { name: 'Animación', icon: Smile },
  { name: 'Educativo', icon: BookOpen }
];

function App() {
  const [profiles, setProfiles] = useState(INITIAL_PROFILES);
  const [videos, setVideos] = useState(INITIAL_VIDEOS);
  const [activeProfileId, setActiveProfileId] = useState(null);

  // Vistas: 'splash' -> 'selector' -> 'kids_home'
  const [currentView, setCurrentView] = useState('splash');
  const [activeCategory, setActiveCategory] = useState('Todos');
  const [playingVideo, setPlayingVideo] = useState(null);

  // Heurística #1: Visibilidad del estado del sistema (Toasts informativos)
  const [toastMessage, setToastMessage] = useState(null);

  // Heurística #5 y #9: Prevención y manejo de errores
  const [gateError, setGateError] = useState(false);

  const activeProfile = profiles.find(p => p.id === activeProfileId);

  useEffect(() => {
    let timer;
    if (currentView === 'splash') {
      timer = setTimeout(() => {
        setCurrentView('selector');
      }, 5000); // 5 segundos exactos de animación
    }
    return () => clearTimeout(timer);
  }, [currentView]);

  const handleLogin = (id) => {
    setActiveProfileId(id);
    setCurrentView('kids_home');
  };

  const handleLogout = () => {
    setActiveProfileId(null);
    setCurrentView('selector');
    setActiveCategory('Todos');
  };

  const showToast = (message) => {
    setToastMessage(message);
    setTimeout(() => setToastMessage(null), 3000);
  };

  const toggleFavorite = (videoId) => {
    setProfiles(profiles.map(profile => {
      if (profile.id === activeProfileId) {
        const isFav = profile.favorites.includes(videoId);
        if (!isFav) showToast('¡Añadido a favoritos! ❤️');
        else showToast('Eliminado de favoritos 💔');

        return {
          ...profile,
          favorites: isFav ? profile.favorites.filter(id => id !== videoId) : [...profile.favorites, videoId]
        };
      }
      return profile;
    }));
  };

  const playVideo = (video) => {
    setProfiles(profiles.map(profile => {
      if (profile.id === activeProfileId) {
        const newHistory = [video.id, ...profile.history.filter(id => id !== video.id)].slice(0, 20);
        return { ...profile, history: newHistory };
      }
      return profile;
    }));
    setPlayingVideo(video);
  };

  const addNewVideo = (newVideoData) => {
    const newVideo = { ...newVideoData, id: Date.now(), isNew: true };
    setVideos([newVideo, ...videos]);
    setCurrentView('kids_home');
    showToast('¡Nuevo video publicado! ✨');
  };

  if (currentView === 'splash') {
    return (
      <div className="flex flex-col items-center justify-center min-h-screen w-full bg-gradient-to-b from-blue-300 via-purple-300 to-pink-300 overflow-hidden relative font-sans">
        <Star className="absolute top-10 left-10 text-yellow-300 w-16 h-16 md:w-24 md:h-24 animate-pulse" fill="currentColor" />
        <Music className="absolute bottom-20 right-10 md:right-32 text-blue-500 w-16 h-16 md:w-24 md:h-24 animate-bounce" />
        <Smile className="absolute top-20 right-16 md:right-40 text-pink-500 w-12 h-12 md:w-20 md:h-20 animate-spin-slow" />

        <div className="relative z-10 flex flex-col items-center animate-bounce-slow">
          <div className="bg-white p-6 md:p-10 rounded-[2.5rem] shadow-2xl rotate-3 mb-6">
            <PlayCircle className="w-32 h-32 md:w-48 md:h-48 text-blue-500 fill-current" />
          </div>
          <h1 className="text-6xl md:text-8xl font-black text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.15)] tracking-wider">
            KidsPlay
          </h1>
          <div className="mt-8 flex gap-3 md:gap-5">
            <div className="w-5 h-5 bg-white rounded-full animate-bounce" style={{ animationDelay: '0s' }}></div>
            <div className="w-5 h-5 bg-white rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></div>
            <div className="w-5 h-5 bg-white rounded-full animate-bounce" style={{ animationDelay: '0.4s' }}></div>
          </div>
        </div>
      </div>
    );
  }

  // Heurística #8: Diseño estético y minimalista
  if (currentView === 'selector') {
    return (
      <div className="flex flex-col items-center justify-center min-h-screen bg-blue-50 p-6 font-sans relative overflow-hidden w-full">
        <div className="absolute top-[-10%] right-[-10%] w-64 h-64 md:w-96 md:h-96 bg-yellow-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
        <div className="absolute bottom-[-10%] left-[-10%] w-64 h-64 md:w-96 md:h-96 bg-pink-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>

        <div className="z-10 w-full max-w-4xl flex flex-col items-center">
          <h1 className="text-5xl md:text-6xl font-black text-blue-600 mb-2 text-center drop-shadow-sm">¡Hola!</h1>
          <h2 className="text-2xl md:text-3xl font-bold text-gray-500 mb-12 text-center">¿Quién va a jugar hoy?</h2>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-6 md:gap-10 w-full">
            {profiles.map(profile => (
              <button
                key={profile.id}
                onClick={() => handleLogin(profile.id)}
                className={`${profile.color} rounded-[2.5rem] p-6 flex flex-col items-center justify-center shadow-[0_8px_0_rgba(0,0,0,0.1)] transform transition hover:-translate-y-2 active:translate-y-2 active:shadow-none group`}
              >
                <div className="bg-white w-28 h-28 md:w-36 md:h-36 rounded-full mb-4 shadow-inner flex items-center justify-center border-4 border-white/50 group-hover:scale-110 transition-transform duration-300">
                  <img src={profile.avatar} alt={profile.name} className="w-20 h-20 md:w-26 md:h-26 object-contain drop-shadow-md" />
                </div>
                <span className="text-3xl md:text-4xl font-extrabold text-white drop-shadow-md">{profile.name}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // Heurística #5: Prevención de errores; Heurística #9: Diagnóstico amable de errores
  if (currentView === 'parent_gate') {
    return (
      <div className="flex flex-col items-center justify-center min-h-screen w-full bg-gray-900 p-6 text-white font-sans relative">
        <div className="bg-gray-800 p-10 md:p-16 rounded-[3rem] max-w-lg w-full flex flex-col items-center shadow-2xl border border-gray-700">
          <Lock className="w-20 h-20 mb-6 text-yellow-400" />
          <h2 className="text-3xl md:text-4xl font-bold mb-4 text-center">Zona para Papás</h2>
          <p className="mb-8 text-center text-gray-300 text-lg md:text-xl">Para entrar, resuelve la operación:</p>

          <div className={`text-6xl md:text-7xl font-bold mb-10 transition-all duration-300 ${gateError ? 'text-red-400 scale-110 shake' : 'text-white'}`}>
            7 x 3 = ?
          </div>

          {gateError && (
            <p className="text-red-400 mb-6 font-bold flex items-center gap-2 bg-red-900/30 px-6 py-3 rounded-full text-lg">
              <AlertCircle className="w-6 h-6"/> ¡Uy! Intenta de nuevo.
            </p>
          )}

          <div className="grid grid-cols-3 gap-4 w-full">
            {[14, 21, 28].map(ans => (
              <button
                key={ans}
                onClick={() => {
                  if (ans === 21) { setGateError(false); setCurrentView('parent_dashboard'); }
                  else { setGateError(true); setTimeout(() => setGateError(false), 1500); }
                }}
                className="bg-gray-700 p-6 rounded-2xl text-3xl font-bold hover:bg-gray-600 active:bg-blue-600 active:scale-95 transition"
              >
                {ans}
              </button>
            ))}
          </div>
        </div>

        {/* Heurística #3: Libertad del usuario para salir libremente */}
        <button onClick={() => { setGateError(false); setCurrentView('kids_home'); }} className="mt-10 text-gray-400 flex items-center gap-2 hover:text-white transition bg-gray-800/50 px-8 py-4 rounded-full text-lg font-bold">
          <X className="w-6 h-6" /> Cancelar y Volver
        </button>
      </div>
    );
  }

  if (currentView === 'parent_dashboard') {
    const ParentDashboard = () => {
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('Música');
      const [thumbnail, setThumbnail] = useState('https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=400&q=80');
      const [url, setUrl] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (title) addNewVideo({ title, category, thumbnail, url });
      };

      return (
        <div className="min-h-screen w-full bg-gray-100 p-4 md:p-10 font-sans flex justify-center">
          <div className="max-w-4xl w-full">
            <div className="flex justify-between items-center mb-8">
              <h2 className="text-3xl font-extrabold text-gray-800">Panel de Control para Padres</h2>
              <button onClick={() => setCurrentView('kids_home')} className="flex items-center gap-2 text-gray-600 hover:text-red-600 font-bold bg-white px-5 py-3 rounded-full shadow-sm transition">
                <LogOut className="w-5 h-5" /> Salir del Panel
              </button>
            </div>

            <div className="grid md:grid-cols-2 gap-8">
              <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                <h3 className="text-xl font-bold mb-6 flex items-center gap-2 text-blue-600">
                  <Plus className="text-blue-500 bg-blue-100 p-1 rounded-full w-8 h-8" /> Añadir Nuevo Video
                </h3>
                <form onSubmit={handleSubmit} className="space-y-5">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">Título del Video</label>
                    <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ej: Canción del Abecedario" className="w-full p-4 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none transition" required />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">Categoría</label>
                    <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full p-4 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none transition">
                      <option>Música</option>
                      <option>Animación</option>
                      <option>Educativo</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">URL del Video (Youtube Embed)</label>
                    <input type="text" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="Ej: https://www.youtube.com/embed/..." className="w-full p-4 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none transition" />
                  </div>
                  <button type="submit" className="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 shadow-lg active:translate-y-1 transition text-lg mt-4">
                    Publicar para los Niños
                  </button>
                </form>
              </div>

              <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 h-fit">
                <h3 className="text-lg font-bold mb-6 text-gray-800">Videos Agregados Recientemente</h3>
                <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                  {videos.map(v => (
                    <div key={v.id} className="flex justify-between items-center p-4 border border-gray-100 rounded-2xl bg-gray-50">
                      <div className="flex items-center gap-4">
                        <img src={v.thumbnail} className="w-16 h-16 rounded-xl object-cover shadow-sm" alt="thumb"/>
                        <div>
                          <p className="font-bold text-gray-800">{v.title}</p>
                          <p className="text-sm font-medium text-gray-500">{v.category}</p>
                        </div>
                      </div>
                      {v.isNew && <span className="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wide">Nuevo</span>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };
    return <ParentDashboard />;
  }

  const VideoPlayerModal = () => {
    if (!playingVideo) return null;
    return (
      <div className="fixed inset-0 bg-black z-[100] flex flex-col p-2 md:p-10 lg:p-20">
        <div className="absolute top-4 right-4 md:top-8 md:right-8 z-[110]">
          <button onClick={() => setPlayingVideo(null)} className="p-3 md:p-4 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-full transition active:scale-90 shadow-2xl border border-white/30 text-white">
            <X className="w-8 h-8 md:w-10 md:h-10" />
          </button>
        </div>
        <div className="flex-1 flex items-center justify-center bg-gray-900 relative rounded-[2rem] md:rounded-[3rem] overflow-hidden shadow-2xl border border-gray-800">
          {playingVideo.url ? (
            <iframe
              className="w-full h-full"
              src={playingVideo.url}
              title={playingVideo.title}
              frameBorder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowFullScreen
            ></iframe>
          ) : (
            <div className="text-white">URL no válida</div>
          )}
        </div>
      </div>
    );
  };

  let displayVideos = [];
  if (currentView === 'kids_history') {
    displayVideos = activeProfile?.history.map(id => videos.find(v => v.id === id)).filter(Boolean) || [];
  } else if (currentView === 'kids_favorites') {
    displayVideos = activeProfile?.favorites.map(id => videos.find(v => v.id === id)).filter(Boolean) || [];
  } else {
    displayVideos = activeCategory === 'Todos' ? videos : videos.filter(v => v.category === activeCategory);
  }

  const newReleases = videos.filter(v => v.isNew);

  return (
    <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row font-sans selection:bg-blue-200">

      <style>{`
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          50% { transform: translateX(5px); }
          75% { transform: translateX(-5px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-spin-slow { animation: spin 8s linear infinite; }
        .animate-bounce-slow { animation: bounce 3s infinite; }
      `}</style>

      {/* --- SIDEBAR LATERAL (Solo para Tablets y Escritorio: Heurística #8 y #4) --- */}
      <aside className="hidden md:flex flex-col w-28 lg:w-64 bg-white border-r border-gray-200 shadow-lg z-30 justify-between py-8">
        <div>
          {/* Perfil en Sidebar */}
          <div className="flex flex-col items-center justify-center mb-10 px-4">
            <div className={`${activeProfile?.color || 'bg-gray-200'} w-20 h-20 lg:w-28 lg:h-28 rounded-full flex items-center justify-center shadow-inner overflow-hidden border-4 border-white ring-4 ring-gray-100 mb-4`}>
              <img src={activeProfile?.avatar} alt="Avatar" className="w-14 h-14 lg:w-20 lg:h-20 object-contain drop-shadow-md" />
            </div>
            <h1 className="text-2xl font-black text-gray-800 text-center lg:block hidden">{activeProfile?.name}</h1>
          </div>

          {/* Navegación Sidebar */}
          <nav className="flex flex-col gap-4 px-4">
            <DesktopNavButton icon={Home} label="Inicio" isActive={currentView === 'kids_home'} onClick={() => setCurrentView('kids_home')} />
            <DesktopNavButton icon={Clock} label="Historial" isActive={currentView === 'kids_history'} onClick={() => setCurrentView('kids_history')} />
            <DesktopNavButton icon={Heart} label="Favoritos" isActive={currentView === 'kids_favorites'} onClick={() => setCurrentView('kids_favorites')} />
          </nav>
        </div>

        {/* Botones de Control */}
        <div className="flex flex-col gap-4 px-4">
          <button onClick={() => setCurrentView('parent_gate')} className="flex items-center lg:justify-start justify-center gap-3 p-4 bg-gray-100 rounded-2xl text-gray-500 hover:bg-gray-200 hover:text-gray-800 transition shadow-sm font-bold">
            <Lock className="w-6 h-6" /> <span className="hidden lg:block">Zona Papás</span>
          </button>
          <button onClick={handleLogout} className="flex items-center lg:justify-start justify-center gap-3 p-4 bg-red-50 rounded-2xl text-red-500 hover:bg-red-100 transition shadow-sm font-bold">
            <LogOut className="w-6 h-6" /> <span className="hidden lg:block">Cambiar Perfil</span>
          </button>
        </div>
      </aside>

      {/* --- CONTENIDO PRINCIPAL --- */}
      <main className="flex-1 flex flex-col min-h-screen overflow-y-auto pb-28 md:pb-0 relative">

        {/* Cabecera Móvil (Oculta en Tablet/Escritorio) */}
        <div className="md:hidden bg-white px-5 pt-8 pb-5 rounded-b-[2rem] shadow-sm flex justify-between items-center sticky top-0 z-20 border-b border-gray-100">
          <div className="flex items-center gap-3">
            <div className={`${activeProfile?.color || 'bg-gray-200'} w-14 h-14 rounded-full flex items-center justify-center shadow-inner overflow-hidden border-2 border-white ring-2 ring-gray-100 bg-white`}>
              <img src={activeProfile?.avatar} alt="Avatar" className="w-10 h-10 object-contain drop-shadow-sm" />
            </div>
            <div>
              <p className="text-xs text-gray-400 font-extrabold uppercase tracking-wider">¡Hola!</p>
              <h1 className="text-xl font-black text-gray-800">{activeProfile?.name}</h1>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={handleLogout} className="p-3 bg-red-50 rounded-full text-red-500 active:bg-red-100 transition shadow-sm" aria-label="Cambiar perfil"><LogOut className="w-6 h-6" /></button>
            <button onClick={() => setCurrentView('parent_gate')} className="p-3 bg-gray-100 rounded-full text-gray-500 active:bg-gray-200 transition shadow-sm" aria-label="Zona de padres"><Lock className="w-6 h-6" /></button>
          </div>
        </div>

        {/* Contenedor Interior */}
        <div className="p-5 md:p-8 lg:p-12 space-y-8 max-w-7xl mx-auto w-full">

          {/* Banner de Novedades */}
          {currentView === 'kids_home' && newReleases.length > 0 && (
            <section>
              <h2 className="text-2xl md:text-3xl font-black text-gray-800 mb-6 flex items-center gap-3">
                <Sparkles className="text-yellow-500 w-8 h-8" fill="currentColor" /> ¡Videos Nuevos!
              </h2>
              <div className="flex overflow-x-auto gap-4 md:gap-6 pb-6 snap-x hide-scrollbar px-2">
                {newReleases.map(video => (
                  <div key={video.id} onClick={() => playVideo(video)} className="snap-center shrink-0 w-64 md:w-80 lg:w-96 relative rounded-[2rem] overflow-hidden shadow-lg transform transition hover:scale-[1.02] active:scale-95 cursor-pointer ring-1 ring-black/5">
                    <div className="absolute top-4 left-4 bg-red-500 text-white text-xs md:text-sm font-black px-4 py-1.5 rounded-full z-10 animate-bounce shadow-md tracking-wide">
                      ¡ESTRENO!
                    </div>
                    <img src={video.thumbnail} alt={video.title} className="w-full h-44 md:h-56 object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/20 to-transparent"></div>
                    <div className="absolute inset-0 flex items-center justify-center opacity-90">
                      <div className="bg-white/20 p-5 rounded-full backdrop-blur-md shadow-lg border border-white/20">
                        <Play className="w-12 h-12 text-white fill-current drop-shadow-md" />
                      </div>
                    </div>
                    <div className="absolute bottom-0 left-0 right-0 p-6">
                      <h3 className="text-white font-bold text-xl leading-tight truncate drop-shadow-md">{video.title}</h3>
                      <p className="text-gray-300 text-sm md:text-base font-medium mt-1">{video.category}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* Filtros de Categorías */}
          {currentView === 'kids_home' && (
            <div className="flex overflow-x-auto gap-3 pb-4 hide-scrollbar px-2">
              {CATEGORIES.map(cat => {
                const Icon = cat.icon;
                const isActive = activeCategory === cat.name;
                return (
                  <button
                    key={cat.name}
                    onClick={() => setActiveCategory(cat.name)}
                    className={`flex items-center gap-2 px-6 py-4 rounded-full font-bold whitespace-nowrap transition-all shadow-sm text-sm md:text-base ${
                      isActive ? 'bg-blue-600 text-white ring-4 ring-blue-100 scale-105' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'
                    }`}
                  >
                    <Icon className={`w-5 h-5 md:w-6 md:h-6 ${isActive ? 'text-white' : 'text-blue-500'}`} />
                    {cat.name}
                  </button>
                );
              })}
            </div>
          )}

          {/* Rejilla Principal de Videos */}
          <section>
            <h2 className="text-2xl md:text-3xl font-black text-gray-800 mb-6 pl-2">
              {currentView === 'kids_history' ? 'Lo que ya viste 👀' :
               currentView === 'kids_favorites' ? 'Tus Favoritos ❤️' :
               activeCategory === 'Todos' ? 'Para ti ⭐' : activeCategory}
            </h2>

            {displayVideos.length === 0 ? (
              // Heurística #10: Ayuda y documentación para estados vacíos
              <div className="text-center py-16 md:py-24 bg-white rounded-[2rem] border-2 border-dashed border-gray-200 shadow-sm mx-2">
                <div className="bg-blue-50 w-28 h-28 md:w-32 md:h-32 rounded-full flex items-center justify-center mx-auto mb-6">
                  <Video className="w-14 h-14 md:w-16 md:h-16 text-blue-300" />
                </div>
                <p className="text-gray-800 font-extrabold text-2xl mb-3">¡Está un poco vacío!</p>
                <p className="text-gray-500 font-medium text-base md:text-lg px-8 max-w-md mx-auto leading-relaxed">
                  {currentView === 'kids_history'
                    ? 'Ve a inicio y mira un video. ¡Aparecerá aquí mágicamente!'
                    : 'Toca el corazón en cualquier video que te guste para guardarlo en esta mochila.'}
                </p>
              </div>
            ) : (
              // Rejilla adaptable (Responsiva): 2 cols (Móvil), 3 cols (iPad), 4 cols (PC)
              <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 px-2">
                {displayVideos.map(video => {
                  const isFavorite = activeProfile?.favorites.includes(video.id);
                  return (
                    <div key={video.id} className="bg-white rounded-3xl md:rounded-[2rem] overflow-hidden shadow-sm border border-gray-100 flex flex-col relative group hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                      <button
                        onClick={(e) => { e.stopPropagation(); toggleFavorite(video.id); }}
                        className="absolute top-3 right-3 p-3 bg-white/90 backdrop-blur-md rounded-full z-10 shadow-sm active:scale-75 transition-transform hover:bg-gray-50"
                      >
                        <Heart className={`w-6 h-6 ${isFavorite ? 'text-red-500 fill-current animate-pulse' : 'text-gray-400'}`} />
                      </button>

                      <div onClick={() => playVideo(video)} className="relative cursor-pointer">
                        <img src={video.thumbnail} alt={video.title} className="w-full h-40 md:h-48 object-cover" />
                        <div className="absolute inset-0 bg-black/10 group-hover:bg-black/30 transition flex items-center justify-center">
                          <Play className="w-14 h-14 text-white opacity-0 group-hover:opacity-100 transition-opacity fill-current drop-shadow-lg" />
                        </div>
                      </div>

                      <div className="p-5 bg-white">
                        <h3 className="font-extrabold text-gray-800 text-sm md:text-base leading-tight line-clamp-2">{video.title}</h3>
                        <p className="text-xs md:text-sm font-bold text-gray-400 mt-2">{video.category}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </section>

        </div>
      </main>

      {/* --- NAVEGACIÓN INFERIOR (Solo Móvil) --- */}
      <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-around items-center rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-20 pb-safe">
        <MobileNavButton icon={Home} label="Inicio" isActive={currentView === 'kids_home'} onClick={() => setCurrentView('kids_home')} />
        <MobileNavButton icon={Clock} label="Historial" isActive={currentView === 'kids_history'} onClick={() => setCurrentView('kids_history')} />
        <MobileNavButton icon={Heart} label="Favoritos" isActive={currentView === 'kids_favorites'} onClick={() => setCurrentView('kids_favorites')} />
      </nav>

      <VideoPlayerModal />

      {/* Notificación Toast */}
      {toastMessage && (
        <div className="fixed top-32 md:top-10 left-1/2 transform -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white px-8 py-4 rounded-full shadow-2xl z-50 flex items-center gap-4 font-bold text-lg duration-300">
          <Check className="w-6 h-6 text-green-400 bg-green-400/20 rounded-full p-1" />
          {toastMessage}
        </div>
      )}

    </div>
  );
}

// Botones de navegación móviles
function MobileNavButton({ icon: Icon, label, isActive, onClick }) {
  return (
    <button onClick={onClick} className="flex flex-col items-center justify-center w-20 relative group">
      <div className={`p-3 rounded-2xl mb-1.5 transition-all duration-300 ${isActive ? 'bg-blue-100 text-blue-600 scale-110' : 'text-gray-400 group-hover:bg-gray-50'}`}>
        <Icon className={`w-8 h-8 ${isActive ? 'fill-current' : ''}`} />
      </div>
      <span className={`text-xs font-extrabold transition-colors duration-300 ${isActive ? 'text-blue-600' : 'text-gray-400'}`}>{label}</span>
      {isActive && <div className="absolute -bottom-4 w-2 h-2 bg-blue-600 rounded-full"></div>}
    </button>
  );
}

// Botones de navegación de escritorio / Sidebar
function DesktopNavButton({ icon: Icon, label, isActive, onClick }) {
  return (
    <button onClick={onClick} className={`flex items-center lg:justify-start justify-center gap-4 p-4 rounded-2xl transition-all duration-300 w-full group ${isActive ? 'bg-blue-600 text-white shadow-md transform scale-105' : 'bg-transparent text-gray-500 hover:bg-gray-100'}`}>
      <Icon className={`w-8 h-8 ${isActive ? 'fill-current' : ''}`} />
      <span className={`text-lg font-bold hidden lg:block ${isActive ? 'text-white' : 'text-gray-600'}`}>{label}</span>
    </button>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
